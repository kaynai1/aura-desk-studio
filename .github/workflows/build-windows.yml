name: Build Windows

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download lucide icons
        run: powershell -Command "Invoke-WebRequest -Uri 'https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js' -OutFile 'lucide.min.js'"

      - name: Install dependencies
        run: npm install

      - name: Build Windows portable exe
        run: npx electron-builder --win portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-DeskStudio-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            AURA 双屏工坊 Windows 便携版
            - 下载 AURA-DeskStudio-Windows.exe 直接运行，无需安装
            - 双屏美化：跨屏全景壁纸 / 主题 / 小组件 / 动态粒子 / 昼夜氛围 / 专注模式
